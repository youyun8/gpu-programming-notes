# Base MkDocs configuration. The page tree and navigation are generated by
# scripts/build_site.py into build/mkdocs.yml, which inherits from this file:
#
#   python3 scripts/build_site.py && mkdocs build -f build/mkdocs.yml
site_name: GPU Programming Notes
site_description: CUDA and AMD GPU programming tutorials, plus solutions to LeetGPU and Tensara problems.
repo_name: gpu-programming-notes
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
