# Base MkDocs configuration. The page tree and navigation are generated by
# scripts/build_site.py into build/mkdocs.yml, which inherits from this file:
#
#   python3 scripts/build_site.py && mkdocs build -f build/mkdocs.yml
site_name: GPU Programming Notes
site_description: CUDA and AMD GPU programming tutorials, plus solutions to LeetGPU and Tensara problems.
repo_name: gpu-programming-notes
edit_uri: ""

theme:
  name: material
  language: en
  font: false            # self-hosted Inter + Ubuntu Mono, see site_assets/stylesheets/fonts.css
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.indexes
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-Hant
          name: 繁體中文
          build: true
          nav_translations:
            Home: 首頁
            Tutorials: 教學
            Part I · Foundations: 第一部 · 基礎
            Part II · Parallel Patterns: 第二部 · 平行運算模式
            Part III · Matrix Multiplication: 第三部 · 矩陣乘法
            Part IV · Triton: 第四部 · Triton
            Part V · AMD Architecture & Libraries: 第五部 · AMD 架構與函式庫
            Part VI · Kimi K3 Case Studies: 第六部 · Kimi K3 案例
            Part VII · Publishing: 第七部 · 發布
            Matrix Multiplication · Techniques: 矩陣乘法 · 完整技巧
            LeetGPU: LeetGPU
            Tensara: Tensara
            Topics: 主題
            Tools: 工具
            Example Code: 範例程式
            Chapter 14 · Triton Fundamentals: 第 14 章 · Triton 基礎
            Chapter 15 · Triton Model Kernels: 第 15 章 · Triton 模型 Kernel
            Chapters 09–13 · CUDA Examples: 第 09–13 章 · CUDA 範例
            Matrix Multiplication · Programs: 矩陣乘法 · 範例程式
            AMD Examples: AMD 範例
            Other Examples: 其他範例
            Easy: 初階
            Medium: 中階
            Hard: 進階
  - search
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# KaTeX and fonts are vendored under site_assets/vendor (no CDN; the site works offline).
extra_css:
  - assets/vendor/katex/katex.min.css
  - assets/stylesheets/fonts.css
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/vendor/katex/katex.min.js
  - assets/vendor/katex/contrib/auto-render.min.js
  - assets/javascripts/katex.js
  - assets/javascripts/reading-controls.js

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
