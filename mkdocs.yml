# Base MkDocs configuration. The page tree and navigation are generated by
# scripts/build_site.py into build/mkdocs.yml, which inherits from this file:
#
#   python3 scripts/build_site.py && mkdocs build -f build/mkdocs.yml
site_name: GPU Programming Notes
site_description: CUDA and AMD GPU programming tutorials, plus solutions to LeetGPU and Tensara problems.
repo_name: gpu-programming-notes
edit_uri: ""

theme:
  name: material
  language: en
  font: false            # self-hosted Inter + Ubuntu Mono, see site_assets/stylesheets/fonts.css
  icon:
    logo: material/chip
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
    - toc.integrate      # section links live in the left sidebar; no right-hand panel
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# KaTeX and fonts are vendored under site_assets/vendor (no CDN; the site works offline).
extra_css:
  - assets/vendor/katex/katex.min.css
  - assets/stylesheets/fonts.css
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/vendor/katex/katex.min.js
  - assets/vendor/katex/contrib/auto-render.min.js
  - assets/javascripts/katex.js

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
