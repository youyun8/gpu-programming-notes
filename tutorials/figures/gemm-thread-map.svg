<text x="350" y="70" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">thread (tx = 2, ty = 1): four 4 × 4 patches</text>
<rect x="330" y="82" width="14" height="12" rx="2" class="fig-none s-a" stroke-width="1"/>
<text x="350" y="88" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">warp 0 (tx = 0..15, ty = 0..1)</text>
<text x="330" y="125" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">16 threads × 4 columns = 64 per half of the tile.</text>
<text x="330" y="144" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Thread (tx, ty) owns rows 4ty..4ty+3 and 64+4ty..</text>
<text x="330" y="163" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">and columns 4tx..4tx+3 and 64+4tx..</text>
<text x="330" y="201" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Fragment loads per k step: a_s[kk][4ty], a_s[kk][64+4ty],</text>
<text x="330" y="220" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">b_s[kk][4tx], b_s[kk][64+4tx]: four LDS.128.</text>
<text x="330" y="239" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Lanes tx = 0..7 read 8 consecutive float4 = 128 bytes:</text>
<text x="330" y="258" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">one conflict-free shared-memory wavefront.</text>
<text x="330" y="296" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Adjacent 4 × 4 patches (4tx..4tx+3 and 4tx+4..) would</text>
<text x="330" y="315" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">put lanes 32 bytes apart: 2 wavefronts per load.</text>
