<title>FlashAttention: stream K/V tiles past a block of queries; S never leaves the chip</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="ch13-flash-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="ch13-flash-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="ch13-flash-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="ch13-flash-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="ch13-flash-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="ch13-flash-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="ch13-flash-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="360" class="fig-paper"/>
<rect x="30" y="40" width="60" height="240" rx="0" class="fig-panel s-line" stroke-width="1"/>
<rect x="30" y="110" width="60" height="40" rx="0" class="f-a2 s-a" stroke-width="1.6"/>
<text x="60" y="26" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Q (N × d)</text>
<text x="60" y="130" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">block</text>
<text x="280" y="26" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Kᵀ (d × N): tiles of 32 keys</text>
<rect x="130" y="40" width="56" height="50" rx="0" class="f-b s-b" stroke-width="1.2"/>
<text x="158" y="65" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">K0</text>
<rect x="190" y="40" width="56" height="50" rx="0" class="f-b s-b" stroke-width="1.2"/>
<text x="218" y="65" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">K1</text>
<rect x="250" y="40" width="56" height="50" rx="0" class="f-b2 s-b" stroke-width="1.2"/>
<text x="278" y="65" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">K2</text>
<rect x="310" y="40" width="56" height="50" rx="0" class="f-b s-b" stroke-width="1.2"/>
<text x="338" y="65" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">K3</text>
<rect x="370" y="40" width="56" height="50" rx="0" class="f-b s-b" stroke-width="1.2"/>
<text x="398" y="65" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">K4</text>
<rect x="250" y="110" width="56" height="40" rx="0" class="f-hl2 s-hl" stroke-width="1.6"/>
<text x="278" y="130" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">S</text>
<line x1="278" y1="90" x2="278" y2="110" class="s-b" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="90" y1="130" x2="250" y2="130" class="s-a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="280" y="170" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">S = Q Kᵀ tile (registers)</text>
<text x="280" y="188" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">→ online softmax → P</text>
<text x="280" y="296" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">V (N × d): the matching tile of 32 rows</text>
<rect x="130" y="210" width="56" height="60" rx="0" class="f-d s-d" stroke-width="1.2"/>
<text x="158" y="240" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">V0</text>
<rect x="190" y="210" width="56" height="60" rx="0" class="f-d s-d" stroke-width="1.2"/>
<text x="218" y="240" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">V1</text>
<rect x="250" y="210" width="56" height="60" rx="0" class="f-d2 s-d" stroke-width="1.2"/>
<text x="278" y="240" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">V2</text>
<rect x="310" y="210" width="56" height="60" rx="0" class="f-d s-d" stroke-width="1.2"/>
<text x="338" y="240" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">V3</text>
<rect x="370" y="210" width="56" height="60" rx="0" class="f-d s-d" stroke-width="1.2"/>
<text x="398" y="240" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">V4</text>
<rect x="520" y="110" width="60" height="40" rx="0" class="f-c2 s-c" stroke-width="1.6"/>
<text x="550" y="26" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">O</text>
<text x="550" y="130" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">acc</text>
<line x1="308" y1="130" x2="516" y2="130" class="s-c" stroke-width="1.2" marker-end="url(#ch13-flash-ah-c)"/>
<text x="550" y="174" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">acc ← acc · exp(m_old − m_new)</text>
<text x="550" y="192" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">+ P V<tspan baseline-shift="sub" font-size="75%">t</tspan></text>
<text x="550" y="218" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">at the end: O = acc / l</text>
<text x="360" y="334" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">HBM traffic: Q, K, V read (K, V once per query block), O written; no N × N matrix.</text>
</svg>
