<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" class="fig-svg" role="img">
<title>Split-K epilogue with a per-tile semaphore</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:14px}.fig-small{font-size:12px}.fig-tiny{font-size:9.5px}.fig-big{font-size:16px}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="ch06-split-k-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="ch06-split-k-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="ch06-split-k-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="ch06-split-k-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="ch06-split-k-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="ch06-split-k-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="ch06-split-k-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="250" class="fig-paper"/>
<rect x="30" y="30" width="170" height="42" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="115" y="44.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">workgroup z = 0</text>
<text x="115" y="57.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">partial 128 × 64 tile</text>
<line x1="200" y1="51" x2="330" y2="110" class="s-a" stroke-width="1" marker-end="url(#ch06-split-k-ah-a)"/>
<rect x="30" y="86" width="170" height="42" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="115" y="100.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">workgroup z = 1</text>
<text x="115" y="113.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">partial 128 × 64 tile</text>
<line x1="200" y1="107" x2="330" y2="110" class="s-b" stroke-width="1" marker-end="url(#ch06-split-k-ah-b)"/>
<rect x="30" y="142" width="170" height="42" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="115" y="156.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">workgroup z = 2</text>
<text x="115" y="169.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">partial 128 × 64 tile</text>
<line x1="200" y1="163" x2="330" y2="110" class="s-c" stroke-width="1" marker-end="url(#ch06-split-k-ah-c)"/>
<rect x="330" y="85" width="150" height="50" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="405" y="103.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">C (fp32 or bf16)</text>
<text x="405" y="116.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">global_atomic_add</text>
<rect x="530" y="85" width="170" height="50" rx="4" class="f-hl s-hl" stroke-width="1.2"/>
<text x="615" y="103.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">semaphore[tile]</text>
<text x="615" y="116.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">arrival counter</text>
<line x1="480" y1="110" x2="528" y2="110" class="s-hl" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ch06-split-k-ah-hl)"/>
<text x="360" y="214" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">The last workgroup to arrive does the final phase and resets the counter;</text>
<text x="360" y="232" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">fp32 atomics make the summation order, and so the last bits, non-deterministic.</text>
</svg>
