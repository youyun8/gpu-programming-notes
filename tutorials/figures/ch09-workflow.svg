<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" class="fig-svg" role="img">
<title>The profiling loop: from the whole program down to one kernel, then back</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="ch09-workflow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="ch09-workflow-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="ch09-workflow-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="ch09-workflow-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="ch09-workflow-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="ch09-workflow-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="ch09-workflow-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="330" class="fig-paper"/>
<rect x="22" y="60" width="124" height="84" rx="6" class="fig-paper s-muted" stroke-width="1.4"/>
<text x="84" y="78" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">1. Time it</text>
<text x="84" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">CUDA events;</text>
<text x="84" y="121" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">keep a baseline</text>
<line x1="148" y1="102" x2="158" y2="102" class="s-muted" stroke-width="1.2" marker-end="url(#ch09-workflow-ah-muted)"/>
<rect x="160" y="60" width="124" height="84" rx="6" class="f-a s-a" stroke-width="1.4"/>
<text x="222" y="78" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">2. Timeline</text>
<text x="222" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">Nsight Systems:</text>
<text x="222" y="121" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">where is time?</text>
<line x1="286" y1="102" x2="296" y2="102" class="s-muted" stroke-width="1.2" marker-end="url(#ch09-workflow-ah-muted)"/>
<rect x="298" y="60" width="124" height="84" rx="6" class="f-b s-b" stroke-width="1.4"/>
<text x="360" y="78" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">3. One kernel</text>
<text x="360" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">Nsight Compute:</text>
<text x="360" y="121" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">speed of light</text>
<line x1="424" y1="102" x2="434" y2="102" class="s-muted" stroke-width="1.2" marker-end="url(#ch09-workflow-ah-muted)"/>
<rect x="436" y="60" width="124" height="84" rx="6" class="f-d s-d" stroke-width="1.4"/>
<text x="498" y="78" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">4. Diagnose</text>
<text x="498" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">limiter, stall,</text>
<text x="498" y="121" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">source line</text>
<line x1="562" y1="102" x2="572" y2="102" class="s-muted" stroke-width="1.2" marker-end="url(#ch09-workflow-ah-muted)"/>
<rect x="574" y="60" width="124" height="84" rx="6" class="f-c s-c" stroke-width="1.4"/>
<text x="636" y="78" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">5. Fix one thing</text>
<text x="636" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">then measure</text>
<text x="636" y="121" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">again</text>
<path d="M636.0,146 L636.0,180 L84.0,180 L84.0,148" class="fig-none s-c" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ch09-workflow-ah-c)"/>
<text x="360" y="194" text-anchor="middle" dominant-baseline="central" class="fig-txt t-c fig-small">repeat until the kernel sits near a roof, or the time is spent elsewhere</text>
<text x="40" y="238" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Timeline questions:</text>
<text x="40" y="256" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Is the GPU idle? Copies serialised? Launch gaps? Which kernel dominates?</text>
<text x="40" y="278" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Kernel questions:</text>
<text x="40" y="296" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Memory- or compute-bound? Which stall? Which source line?</text>
</svg>
