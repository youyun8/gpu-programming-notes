<text x="360" y="196" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">Red: the maximum grew, so the old sum is multiplied by exp(m_old − m_new)</text>
<text x="360" y="216" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">before adding 1. Green: add exp(x − m). After the last element,</text>
<text x="360" y="236" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">softmax(x) = exp(x − m) / z; two partial states merge with the same rule.</text>
<text x="360" y="268" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">Here: m = 5, z = 1.582.</text>
