<rect x="300" y="44" width="18" height="24" rx="2" class="f-b s-line" stroke-width="0.6"/>
<rect x="320" y="44" width="18" height="24" rx="2" class="f-b s-line" stroke-width="0.6"/>
<text x="260" y="84" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">thread 1: total T1</text>
<rect x="340" y="44" width="18" height="24" rx="2" class="f-c s-line" stroke-width="0.6"/>
<rect x="360" y="44" width="18" height="24" rx="2" class="f-c s-line" stroke-width="0.6"/>
<rect x="380" y="44" width="18" height="24" rx="2" class="f-c s-line" stroke-width="0.6"/>
<rect x="400" y="44" width="18" height="24" rx="2" class="f-c s-line" stroke-width="0.6"/>
<rect x="420" y="44" width="18" height="24" rx="2" class="f-c s-line" stroke-width="0.6"/>
<rect x="440" y="44" width="18" height="24" rx="2" class="f-c s-line" stroke-width="0.6"/>
<rect x="460" y="44" width="18" height="24" rx="2" class="f-c s-line" stroke-width="0.6"/>
<rect x="480" y="44" width="18" height="24" rx="2" class="f-c s-line" stroke-width="0.6"/>
<text x="420" y="84" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">thread 2: total T2</text>
<text x="520" y="56" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">… up to thread 255</text>
<text x="20" y="130" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">2. warp scan of the thread totals (__shfl_up_sync); lane 31 holds the warp total</text>
<rect x="20" y="146" width="76" height="30" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="58" y="161" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warp 0</text>
<rect x="104" y="146" width="76" height="30" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="142" y="161" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warp 1</text>
<rect x="188" y="146" width="76" height="30" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="226" y="161" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warp 2</text>
<rect x="272" y="146" width="76" height="30" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="310" y="161" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warp 3</text>
<rect x="356" y="146" width="76" height="30" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="394" y="161" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warp 4</text>
<rect x="440" y="146" width="76" height="30" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="478" y="161" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warp 5</text>
<rect x="524" y="146" width="76" height="30" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="562" y="161" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warp 6</text>
<rect x="608" y="146" width="76" height="30" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="646" y="161" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warp 7</text>
<text x="20" y="210" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">3. warp 0 scans the 8 warp totals; every thread adds the totals of earlier warps</text>
<rect x="20" y="226" width="660" height="30" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="350" y="241" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warp_totals[0 … 7] → inclusive scan → carry for each warp</text>
<text x="20" y="288" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">4. each item = its register prefix + its thread's exclusive prefix (+ the tile's carry-in)</text>
<text x="20" y="314" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Only steps 2–3 synchronize; the sequential step does 7 of every 8 additions without any.</text>
</svg>
