<text x="506" y="149" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">element (r, q) = base + r·S + q</text>
<text x="60" y="250" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">ptrs = base + rows[:, None] * S + cols[None, :]</text>
<text x="60" y="272" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">mask = (rows[:, None] &lt; M) &amp; (cols[None, :] &lt; N)</text>
<text x="60" y="294" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">tile = tl.load(ptrs, mask=mask, other=0.0)  # masked lanes read 0</text>
<text x="60" y="316" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">ptrs += BLOCK_K * stride  # move the whole tile along K</text>
<text x="360" y="344" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">S is the row stride in elements; Triton scales by the element size itself.</text>
