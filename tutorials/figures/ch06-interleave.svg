<text x="360" y="196" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">An MFMA keeps the matrix core busy for several cycles after it issues. Placing 1–3 loads,</text>
<text x="360" y="214" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">LDS reads or scalar updates between consecutive MFMAs hides their issue cost entirely:</text>
<text x="360" y="232" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">the matrix core never waits. (Illustrative timing, not cycle-accurate.)</text>
