<rect x="0" y="0" width="720" height="300" class="fig-paper"/>
<rect x="40" y="60" width="92" height="56" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="86" y="79.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 0</text>
<text x="86" y="96.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">P: 0–0: 12</text>
<rect x="144" y="60" width="92" height="56" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="190" y="79.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 1</text>
<text x="190" y="96.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">P: 0–1: 30</text>
<rect x="248" y="60" width="92" height="56" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="294" y="79.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 2</text>
<text x="294" y="96.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">A: sum 7</text>
<rect x="352" y="60" width="92" height="56" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="398" y="79.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 3</text>
<text x="398" y="96.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">A: sum 9</text>
<rect x="456" y="60" width="92" height="56" rx="4" class="f-hl s-hl" stroke-width="1.2"/>
<text x="502" y="79.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 4</text>
<text x="502" y="96.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">X: not ready</text>
<rect x="560" y="60" width="92" height="56" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="606" y="79.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 5</text>
<text x="606" y="96.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">scanning</text>
<text x="606" y="40" text-anchor="middle" dominant-baseline="central" class="fig-txt t-a fig-small">current tile</text>
<line x1="590" y1="150" x2="502" y2="150" class="s-ink" stroke-width="1" marker-end="url(#ch11-lookback-ah-ink)"/>
<text x="596" y="150" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">waits (X)</text>
<line x1="590" y1="176" x2="398" y2="176" class="s-ink" stroke-width="1" marker-end="url(#ch11-lookback-ah-ink)"/>
<text x="596" y="176" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">+9 (A)</text>
<line x1="590" y1="202" x2="294" y2="202" class="s-ink" stroke-width="1" marker-end="url(#ch11-lookback-ah-ink)"/>
<text x="596" y="202" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">+7 (A)</text>
<line x1="590" y1="228" x2="190" y2="228" class="s-ink" stroke-width="1" marker-end="url(#ch11-lookback-ah-ink)"/>
<text x="596" y="228" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">+30 (P): stop</text>
<text x="360" y="268" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">X: nothing published. A: the tile's own sum. P: the inclusive prefix up to that tile.</text>
<text x="360" y="286" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">Tile 5's exclusive prefix = 9 + 7 + 30 = 46; it then publishes P: 46 + its own sum.</text>
</svg>
