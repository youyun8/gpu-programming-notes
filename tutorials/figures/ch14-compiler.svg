<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" class="fig-svg" role="img">
<title>From a @triton.jit function to machine code</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="ch14-compiler-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="ch14-compiler-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="ch14-compiler-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="ch14-compiler-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="ch14-compiler-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="ch14-compiler-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="ch14-compiler-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="300" class="fig-paper"/>
<rect x="23" y="50" width="118" height="78" rx="6" class="fig-paper s-muted" stroke-width="1.4"/>
<text x="82" y="67" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Python AST</text>
<text x="82" y="92" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">@triton.jit</text>
<text x="82" y="109" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">function</text>
<line x1="143" y1="89" x2="160" y2="89" class="s-muted" stroke-width="1.2" marker-end="url(#ch14-compiler-ah-muted)"/>
<rect x="162" y="50" width="118" height="78" rx="6" class="f-a s-a" stroke-width="1.4"/>
<text x="221" y="67" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Triton IR</text>
<text x="221" y="92" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">block ops,</text>
<text x="221" y="109" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">no layouts</text>
<line x1="282" y1="89" x2="299" y2="89" class="s-muted" stroke-width="1.2" marker-end="url(#ch14-compiler-ah-muted)"/>
<rect x="301" y="50" width="118" height="78" rx="6" class="f-b s-b" stroke-width="1.4"/>
<text x="360" y="67" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">TritonGPU IR</text>
<text x="360" y="92" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">layouts, smem,</text>
<text x="360" y="109" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">pipelining</text>
<line x1="421" y1="89" x2="438" y2="89" class="s-muted" stroke-width="1.2" marker-end="url(#ch14-compiler-ah-muted)"/>
<rect x="440" y="50" width="118" height="78" rx="6" class="f-d s-d" stroke-width="1.4"/>
<text x="499" y="67" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">LLVM IR</text>
<text x="499" y="92" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">per-thread</text>
<text x="499" y="109" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">code</text>
<line x1="560" y1="89" x2="577" y2="89" class="s-muted" stroke-width="1.2" marker-end="url(#ch14-compiler-ah-muted)"/>
<rect x="579" y="50" width="118" height="78" rx="6" class="f-c s-c" stroke-width="1.4"/>
<text x="638" y="67" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">PTX / AMDGCN</text>
<text x="638" y="92" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">→ cubin / hsaco</text>
<text x="638" y="109" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">(ptxas, LLVM)</text>
<text x="40" y="170" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Specialisation:</text>
<text x="160" y="170" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">one binary per set of constexpr values, dtypes and pointer alignments</text>
<text x="40" y="200" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Cache:</text>
<text x="160" y="200" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">compiled kernels are cached on disk (~/.triton/cache)</text>
<text x="40" y="230" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Inspect:</text>
<text x="160" y="230" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">kernel.asm['ttgir'], ['ptx'] and ['cubin'] of the compiled handle</text>
<text x="40" y="260" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">Interpreter:</text>
<text x="160" y="260" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">TRITON_INTERPRET=1 skips all of this and runs the ops in NumPy</text>
</svg>
