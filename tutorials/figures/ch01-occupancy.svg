<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" class="fig-svg" role="img">
<title>Occupancy example: B = 256, r = 64, s = 32 KB on an A100</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:14px}.fig-small{font-size:12px}.fig-tiny{font-size:9.5px}.fig-big{font-size:16px}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="ch01-occupancy-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="ch01-occupancy-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="ch01-occupancy-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="ch01-occupancy-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="ch01-occupancy-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="ch01-occupancy-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="ch01-occupancy-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="250" class="fig-paper"/>
<text x="220" y="42" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small">threads: ⌊2048 / 256⌋</text>
<rect x="232" y="30" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="280" y="30" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="328" y="30" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="376" y="30" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="424" y="30" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<rect x="472" y="30" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<rect x="520" y="30" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<rect x="568" y="30" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<text x="622" y="42" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">8</text>
<text x="220" y="76" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small">registers: ⌊65536 / (64·256)⌋</text>
<rect x="232" y="64" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="280" y="64" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="328" y="64" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="376" y="64" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<text x="430" y="76" text-anchor="start" dominant-baseline="central" class="fig-txt t-hl fig-small fig-bold">4</text>
<text x="220" y="110" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small">shared memory: ⌊164 / 32⌋</text>
<rect x="232" y="98" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="280" y="98" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="328" y="98" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="376" y="98" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="424" y="98" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<text x="478" y="110" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">5</text>
<text x="220" y="144" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small">block slots: 32</text>
<rect x="232" y="132" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="280" y="132" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="328" y="132" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="376" y="132" width="44" height="24" rx="3" class="f-c2 s-c" stroke-width="0.8"/>
<rect x="424" y="132" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<rect x="472" y="132" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<rect x="520" y="132" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<rect x="568" y="132" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<rect x="616" y="132" width="44" height="24" rx="3" class="f-c s-c" stroke-width="0.8"/>
<text x="666" y="144" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">… 32</text>
<line x1="422" y1="22" x2="422" y2="166" class="s-hl" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="360" y="184" text-anchor="middle" dominant-baseline="central" class="fig-txt t-hl fig-small">min = 4 blocks = 1024 threads → 50 % occupancy (registers are the limit)</text>
<text x="360" y="230" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">Each resource allows some number of resident blocks per SM; the smallest wins.</text>
</svg>
