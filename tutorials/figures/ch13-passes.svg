<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" class="fig-svg" role="img">
<title>Memory passes over one row: three-pass vs online softmax</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="ch13-passes-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="ch13-passes-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="ch13-passes-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="ch13-passes-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="ch13-passes-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="ch13-passes-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="ch13-passes-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="260" class="fig-paper"/>
<text x="236" y="58" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">three-pass</text>
<rect x="250" y="40" width="125" height="36" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="312.5" y="58" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read: max</text>
<rect x="383" y="40" width="125" height="36" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="445.5" y="58" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read: sum exp</text>
<rect x="516" y="40" width="146" height="36" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="589" y="58" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read + write</text>
<text x="236" y="122" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">online (two-pass)</text>
<rect x="250" y="104" width="146" height="36" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="323" y="122" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read: max and sum</text>
<rect x="404" y="104" width="146" height="36" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="477" y="122" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read + write</text>
<text x="236" y="186" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">online, row in registers</text>
<rect x="250" y="168" width="174" height="36" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="337" y="186" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read once, write once</text>
<text x="360" y="222" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">Rows that fit in L1/L2 make the re-reads cheap; long rows and big batches make them</text>
<text x="360" y="240" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">DRAM traffic. Keeping (max, sum) as one state removes a whole pass.</text>
</svg>
