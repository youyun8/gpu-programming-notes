<rect x="150" y="194" width="14" height="12" rx="2" class="f-b s-b" stroke-width="1"/>
<text x="170" y="200" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">global → registers → shared (latency ~ hundreds of cycles)</text>
<rect x="150" y="212" width="14" height="12" rx="2" class="f-c s-c" stroke-width="1"/>
<text x="170" y="218" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">FMAs on the shared tiles</text>
<rect x="150" y="230" width="14" height="12" rx="2" class="f-hl s-hl" stroke-width="1"/>
<text x="170" y="236" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">__syncthreads()</text>
<text x="150" y="265" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">With one buffer the warp waits for every load; with two, slice s + 1 is fetched</text>
<text x="150" y="283" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">while slice s is computed, and one barrier per slice suffices.</text>
