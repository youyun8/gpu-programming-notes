<text x="269" y="56.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">stage 0</text>
<text x="269" y="73.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">A + B tiles</text>
<rect x="320" y="40" width="86" height="50" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="363" y="56.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">stage 1</text>
<text x="363" y="73.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">A + B tiles</text>
<rect x="414" y="40" width="86" height="50" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="457" y="56.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">stage 2</text>
