<rect x="508" y="40" width="86" height="50" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="551" y="56.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">stage 3</text>
<text x="551" y="73.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">A + B tiles</text>
<line x1="180" y1="65" x2="224" y2="65" class="s-b" stroke-width="1.4" marker-end="url(#gemm-hopper-ah-b)"/>
<rect x="240" y="150" width="310" height="50" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="395" y="166.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">warpgroup = 4 warps: wgmma.mma_async</text>
<text x="395" y="183.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">B (and A) read straight from shared memory</text>
<line x1="269" y1="90" x2="300" y2="148" class="s-d" stroke-width="1" marker-end="url(#gemm-hopper-ah-d)"/>
<line x1="363" y1="90" x2="350" y2="148" class="s-d" stroke-width="1" marker-end="url(#gemm-hopper-ah-d)"/>
<line x1="457" y1="90" x2="400" y2="148" class="s-d" stroke-width="1" marker-end="url(#gemm-hopper-ah-d)"/>
<line x1="551" y1="90" x2="450" y2="148" class="s-d" stroke-width="1" marker-end="url(#gemm-hopper-ah-d)"/>
<rect x="590" y="150" width="110" height="50" rx="4" class="f-d2 s-d" stroke-width="1.2"/>
<text x="645" y="166.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">accumulators</text>
<text x="645" y="183.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">in registers</text>
<line x1="550" y1="175" x2="588" y2="175" class="s-d" stroke-width="1.4" marker-end="url(#gemm-hopper-ah-d)"/>
<text x="410" y="20" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">per stage: a "full" mbarrier (TMA bytes arrived) and an "empty" one (stage consumed)</text>
<text x="360" y="235" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">Producer and consumers sync per stage with mbarriers (transaction counts), not __syncthreads();</text>
<text x="360" y="255" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">the MMA is asynchronous and wide (m64 nN k16 per warpgroup), so issue slots stay free.</text>
</svg>
