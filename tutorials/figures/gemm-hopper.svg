<rect x="0" y="0" width="720" height="270" class="fig-paper"/>
<rect x="30" y="40" width="150" height="50" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="105" y="56.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">TMA</text>
<text x="105" y="73.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">(1 thread issues)</text>
