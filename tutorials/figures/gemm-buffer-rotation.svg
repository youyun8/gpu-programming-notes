<rect x="0" y="0" width="720" height="222" class="fig-paper"/>
<text x="160" y="40" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">step</text>
<text x="230" y="40" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">s = 0</text>
<text x="350" y="40" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">s = 1</text>
<text x="470" y="40" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">s = 2</text>
<text x="590" y="40" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">s = 3</text>
<text x="160" y="80" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">buffer 0</text>
<rect x="176" y="60" width="108" height="40" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="230" y="80" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read slice 0</text>
<rect x="296" y="60" width="108" height="40" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="350" y="80" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">write slice 2</text>
<rect x="416" y="60" width="108" height="40" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="470" y="80" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read slice 2</text>
<rect x="536" y="60" width="108" height="40" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="590" y="80" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">write slice 4</text>
<text x="160" y="140" text-anchor="end" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">buffer 1</text>
<rect x="176" y="120" width="108" height="40" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="230" y="140" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">write slice 1</text>
<rect x="296" y="120" width="108" height="40" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="350" y="140" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read slice 1</text>
<rect x="416" y="120" width="108" height="40" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="470" y="140" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">write slice 3</text>
<rect x="536" y="120" width="108" height="40" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="590" y="140" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">read slice 3</text>
<line x1="290" y1="52" x2="290" y2="172" class="s-hl" stroke-width="2"/>
<line x1="410" y1="52" x2="410" y2="172" class="s-hl" stroke-width="2"/>
<line x1="530" y1="52" x2="530" y2="172" class="s-hl" stroke-width="2"/>
<line x1="650" y1="52" x2="650" y2="172" class="s-hl" stroke-width="2"/>
<text x="410" y="190" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">Red: the one __syncthreads() per step. A buffer is rewritten only after</text>
<text x="410" y="208" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">the barrier that ends its last read.</text>
</svg>
