<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292" class="fig-svg" role="img">
<title>Memory hierarchy of an A100: each level is larger and slower</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="ch02-memory-levels-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="ch02-memory-levels-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="ch02-memory-levels-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="ch02-memory-levels-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="ch02-memory-levels-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="ch02-memory-levels-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="ch02-memory-levels-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="292" class="fig-paper"/>
<rect x="175" y="20" width="150" height="48" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="250" y="35" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">registers</text>
<text x="250" y="53" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">per thread</text>
<text x="470" y="36" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">~1 cycle</text>
<text x="600" y="36" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">256 KB / SM</text>
<rect x="130" y="76" width="240" height="48" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="250" y="91" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">shared memory / L1</text>
<text x="250" y="109" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">per block / per SM</text>
<text x="470" y="92" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">~20–30 cycles</text>
<text x="600" y="92" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">192 KB / SM</text>
<rect x="85" y="132" width="330" height="48" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="250" y="147" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">L2 cache</text>
<text x="250" y="165" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">whole GPU</text>
<text x="470" y="148" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">~200 cycles</text>
<text x="600" y="148" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">40 MB</text>
<rect x="40" y="188" width="420" height="48" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="250" y="203" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">global memory (HBM)</text>
<text x="250" y="221" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">whole GPU</text>
<text x="470" y="204" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">~400–800 cycles</text>
<text x="600" y="204" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">40–80 GB</text>
<text x="470" y="12" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">latency</text>
<text x="600" y="12" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">size</text>
<line x1="700" y1="30" x2="700" y2="230" class="s-muted" stroke-width="1.4" marker-end="url(#ch02-memory-levels-ah-muted)"/>
<text x="360" y="258" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">Bandwidth drops with every level: DRAM delivers ~1.5 TB/s,</text>
<text x="360" y="276" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">an order of magnitude less than the SMs can consume.</text>
</svg>
