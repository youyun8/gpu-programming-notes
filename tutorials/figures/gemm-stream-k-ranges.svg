<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" class="fig-svg" role="img">
<title>Stream-K ranges, contributors and owners</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="gemm-stream-k-ranges-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="gemm-stream-k-ranges-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="gemm-stream-k-ranges-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="gemm-stream-k-ranges-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="gemm-stream-k-ranges-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="gemm-stream-k-ranges-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="gemm-stream-k-ranges-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="250" class="fig-paper"/>
<text x="40" y="30" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">MAC iterations of the whole GEMM (5 tiles × 8 K-slices)</text>
<rect x="40" y="50" width="128" height="28" rx="0" class="f-a s-a" stroke-width="1.2"/>
<text x="104" y="64" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 0</text>
<rect x="168" y="50" width="128" height="28" rx="0" class="f-b s-b" stroke-width="1.2"/>
<text x="232" y="64" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 1</text>
<rect x="296" y="50" width="128" height="28" rx="0" class="f-c s-c" stroke-width="1.2"/>
<text x="360" y="64" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 2</text>
<rect x="424" y="50" width="128" height="28" rx="0" class="f-d s-d" stroke-width="1.2"/>
<text x="488" y="64" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 3</text>
<rect x="552" y="50" width="128" height="28" rx="0" class="f-hl s-hl" stroke-width="1.2"/>
<text x="616" y="64" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">tile 4</text>
<rect x="41" y="110" width="206" height="26" rx="4" class="fig-paper s-ink" stroke-width="1.2"/>
<text x="144" y="123" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">block 0: iterations 0–12</text>
<line x1="40" y1="80" x2="40" y2="140" class="s-ink" stroke-width="1" stroke-dasharray="2 2"/>
<rect x="249" y="110" width="206" height="26" rx="4" class="fig-paper s-ink" stroke-width="1.2"/>
<text x="352" y="123" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">block 1: iterations 13–25</text>
<line x1="248" y1="80" x2="248" y2="140" class="s-ink" stroke-width="1" stroke-dasharray="2 2"/>
<rect x="457" y="110" width="222" height="26" rx="4" class="fig-paper s-ink" stroke-width="1.2"/>
<text x="568" y="123" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">block 2: iterations 26–39</text>
<line x1="456" y1="80" x2="456" y2="140" class="s-ink" stroke-width="1" stroke-dasharray="2 2"/>
<line x1="680" y1="80" x2="680" y2="140" class="s-ink" stroke-width="1" stroke-dasharray="2 2"/>
<text x="40" y="170" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">block 0: tile 0 whole → store; tile 1 up to iteration 12 → contributor (workspace[0], flag[0]).</text>
<text x="40" y="192" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">block 1: finishes tile 1 → owner: waits for flag[0], adds workspace[0], stores; tile 2 whole → store;</text>
<text x="40" y="214" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">            tile 3 up to iteration 25 → contributor.   block 2: owner of tile 3, then tile 4 whole.</text>
</svg>
