<defs><marker id="ch07-tuning-flow-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="ch07-tuning-flow-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="ch07-tuning-flow-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="ch07-tuning-flow-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="ch07-tuning-flow-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="ch07-tuning-flow-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="ch07-tuning-flow-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="190" class="fig-paper"/>
<text x="115" y="30" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">1. log</text>
<rect x="15" y="44" width="200" height="64" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="115" y="67.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">HIPBLASLT_LOG_MASK=32</text>
<text x="115" y="84.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">prints bench commands</text>
<line x1="217" y1="76" x2="253" y2="76" class="s-ink" stroke-width="1.4" marker-end="url(#ch07-tuning-flow-ah-ink)"/>
<text x="355" y="30" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">2. tune</text>
<rect x="255" y="44" width="200" height="64" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="355" y="67.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">hipblaslt-bench with</text>
<text x="355" y="84.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">HIPBLASLT_TUNING_FILE</text>
<line x1="457" y1="76" x2="493" y2="76" class="s-ink" stroke-width="1.4" marker-end="url(#ch07-tuning-flow-ah-ink)"/>
<text x="595" y="30" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">3. use</text>
<rect x="495" y="44" width="200" height="64" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="595" y="67.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">HIPBLASLT_TUNING_</text>
<text x="595" y="84.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">OVERRIDE_FILE</text>
<text x="360" y="140" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">The tuning file maps each GEMM shape to a solution index, which is only valid for the</text>
<text x="360" y="158" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">same library build and GPU architecture: re-tune after upgrading ROCm.</text>
</svg>
