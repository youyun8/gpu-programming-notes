<text x="526" y="126" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">neighbours share an L2</text>
<text x="360" y="190" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">With the default placement, tiles that share an A or B panel run on different XCDs and each</text>
<text x="360" y="208" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">XCD's 4 MiB L2 fetches the panel separately. Remapping which tile each workgroup ID computes</text>
<text x="360" y="226" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">turns neighbours into L2 hits. (Illustration: 16 tiles, groups of 2 per XCD.)</text>
