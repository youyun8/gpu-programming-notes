name: CI

on:
  push:
  pull_request:

jobs:
  compile:
    name: nvcc compile check (solutions and tutorial programs)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile all solutions
        run: make check

  test:
    name: cuemu tests (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: [leetgpu, tensara]
    env:
      CUEMU_TIMEOUT: "1800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang and Python dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt
      - name: Fetch upstream problem definitions
        run: scripts/fetch_upstream.sh
      - name: Run every ${{ matrix.platform }} solution on the CPU emulator
        run: python3 tools/cuemu/run_tests.py --all --platform ${{ matrix.platform }} -j 4 --json build/${{ matrix.platform }}-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-report
          path: build/${{ matrix.platform }}-report.json

  gemm:
    name: GEMM tutorial programs (cuemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run every program's --test mode on the CPU emulator
        run: |
          clang++ --version
          make gemm-test

  examples:
    name: Chapter 09-13 example programs (cuemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run every example program's checks on the CPU emulator
        run: |
          clang++ --version
          make examples-test

  triton:
    name: Chapters 14-15 Triton kernels (interpreter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch (CPU) and Triton
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install triton==3.8.0 numpy
      - name: Check the kernels against PyTorch in the Triton interpreter
        env:
          TRITON_INTERPRET: "1"
        run: make triton-test

  amd:
    name: AMD tutorial code compiles for gfx942
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Device-only compile with stock clang
        run: |
          clang++ --version
          clang++ -x hip -nogpuinc -nogpulib --cuda-device-only --offload-arch=gfx942 \
                  -O3 -Wall -Werror -S -o mfma_gemm.s tutorials/amd/mfma_gemm.hip
          grep -c v_mfma_f32_16x16x16_bf16 mfma_gemm.s

  docs:
    name: README index and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check README index
        run: python3 scripts/build_index.py --check
      - name: Check site generator
        run: python3 scripts/test_build_site.py
      - name: Check that the figures are current
        run: python3 scripts/build_figures.py --check
      - name: Check that every figure label is legible (no overlaps, no clipping)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/check_figures.py
      - name: Build site (fails on broken links)
        run: |
          pip install -r requirements-docs.txt
          python3 scripts/build_site.py --strict
          mkdocs build --strict -f build/mkdocs.yml
