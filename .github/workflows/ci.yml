name: CI

on:
  push:
  pull_request:

jobs:
  compile:
    name: nvcc compile check
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile all solutions
        run: make check

  index:
    name: README index up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check index
        run: python3 scripts/build_index.py --check
