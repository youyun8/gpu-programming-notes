<text x="298.46" y="113.43" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">P = (x, y)</text>
<text x="298.46" y="176.57" text-anchor="start" dominant-baseline="central" class="fig-txt t-hl fig-small">−P = (x, −y)</text>
<text x="430" y="44" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">curve y² = x³ + 7 (drawn over the reals)</text>
<text x="430" y="78" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">over F<tspan baseline-shift="sub" font-size="75%">p</tspan>, p = 2⁶¹ − 1:</text>
<text x="430" y="95" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">−y mod p = (p − (y mod p)) mod p</text>
<text x="430" y="112" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">(y = 0 maps to 0, not to p)</text>
<text x="430" y="146" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">one thread per point: read (x, y),</text>
<text x="430" y="163" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">write (x, p − y) interleaved;</text>
<text x="430" y="180" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">bandwidth-bound, exact.</text>
