<rect x="132" y="190" width="470" height="34" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="367" y="207" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">y<tspan baseline-shift="sub" font-size="75%">i</tspan> = (1 / (g<tspan baseline-shift="sub" font-size="75%">A</tspan> g<tspan baseline-shift="sub" font-size="75%">x</tspan>)) · Σ<tspan baseline-shift="sub" font-size="75%">β</tspan> s<tspan baseline-shift="super" font-size="75%">A</tspan><tspan baseline-shift="sub" font-size="75%">iβ</tspan> s<tspan baseline-shift="super" font-size="75%">x</tspan><tspan baseline-shift="sub" font-size="75%">β</tspan> Σ<tspan baseline-shift="sub" font-size="75%">ℓ∈β</tspan> e2m1(a) e2m1(x)</text>
<line x1="428" y1="140" x2="360" y2="188" class="s-c" stroke-width="1.1" marker-end="url(#tensara-nvfp4-gemv-ah-c)"/>
<text x="40" y="254" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">4 bits per weight make the GEMV even more bandwidth-bound than FP16: one warp per row,</text>
<text x="40" y="271" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">each lane decodes whole 16-element blocks with a 16-entry table, and FP32 partial sums</text>
<text x="40" y="288" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">are combined with shuffles before the single FP16 store.</text>
