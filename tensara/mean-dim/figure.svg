<text x="40" y="264" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The tensor is viewed as x[o, j, i] = in[(oR + j)·I + i]: O = product of the axes before dim,</text>
<text x="40" y="281" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">R = the reduced length, I = product of the axes after it. Threads take consecutive i, so every</text>
<text x="40" y="298" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">step down j is a coalesced row read; with I = 1 a warp reduces one contiguous row instead.</text>
