<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" width="720" height="288" class="fig-svg" role="img">
<title>Sorting signed int32 with radix sort: flip the sign bit so unsigned order = signed order</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="tensara-array-sort-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="tensara-array-sort-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="tensara-array-sort-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="tensara-array-sort-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="tensara-array-sort-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="tensara-array-sort-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="tensara-array-sort-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="288" class="fig-paper"/>
<text x="60" y="40" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">x</text>
<text x="140" y="40" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">bits(x)</text>
<text x="280" y="40" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">f(x) = bits ⊕ 0x80000000</text>
<text x="540" y="40" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">sorted rank</text>
<text x="60" y="68" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small">−5</text>
<text x="140" y="68" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">0xFFFFFFFB</text>
<text x="280" y="68" text-anchor="start" dominant-baseline="central" class="fig-mono t-c fig-small">0x7FFFFFFB</text>
<text x="540" y="68" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">1</text>
<text x="60" y="92" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small">3</text>
<text x="140" y="92" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">0x00000003</text>
<text x="280" y="92" text-anchor="start" dominant-baseline="central" class="fig-mono t-c fig-small">0x80000003</text>
<text x="540" y="92" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">4</text>
<text x="60" y="116" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small">−1</text>
<text x="140" y="116" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">0xFFFFFFFF</text>
<text x="280" y="116" text-anchor="start" dominant-baseline="central" class="fig-mono t-c fig-small">0x7FFFFFFF</text>
<text x="540" y="116" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">2</text>
<text x="60" y="140" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small">0</text>
<text x="140" y="140" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">0x00000000</text>
<text x="280" y="140" text-anchor="start" dominant-baseline="central" class="fig-mono t-c fig-small">0x80000000</text>
<text x="540" y="140" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">3</text>
<text x="60" y="164" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small">7</text>
<text x="140" y="164" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">0x00000007</text>
<text x="280" y="164" text-anchor="start" dominant-baseline="central" class="fig-mono t-c fig-small">0x80000007</text>
<text x="540" y="164" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">5</text>
<text x="60" y="188" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small">−128</text>
<text x="140" y="188" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">0xFFFFFF80</text>
<text x="280" y="188" text-anchor="start" dominant-baseline="central" class="fig-mono t-c fig-small">0x7FFFFF80</text>
<text x="540" y="188" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">0</text>
<text x="40" y="232" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Two's complement puts the negatives (0x80000000 … 0xFFFFFFFF) above the positives when read</text>
<text x="40" y="249" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">as unsigned numbers; flipping bit 31 swaps the two halves, after which four 8-bit LSD passes</text>
<text x="40" y="266" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">sort the keys exactly.</text>
</svg>
