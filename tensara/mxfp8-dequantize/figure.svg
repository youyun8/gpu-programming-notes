<text x="40" y="158" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">E4M3: 1 sign, 4 exponent (bias 7), 3 mantissa bits, max 448, no infinities (0x7F/0xFF are NaN).</text>
<text x="40" y="175" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The scale byte u = 128 means 2¹: dequantisation is exact, a table lookup and a multiply.</text>
