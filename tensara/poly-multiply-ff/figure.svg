<text x="360" y="60" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">green anti-diagonal: i + j = 4</text>
<text x="360" y="77" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">c<tspan baseline-shift="sub" font-size="75%">4</tspan> = a₀b₄ + a₁b₃ + … + a₄b₀ (mod p)</text>
<text x="360" y="111" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">p = 2³¹ − 1 (Mersenne): each 62-bit</text>
<text x="360" y="128" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">product folds with two shifts and adds,</text>
<text x="360" y="145" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">and 2n − 1 outputs each sum ≤ n terms.</text>
<text x="360" y="179" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Thread k sums its anti-diagonal with a</text>
<text x="360" y="196" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">and b staged in shared memory; the</text>
<text x="360" y="213" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">sum is kept in 64 bits and reduced</text>
<text x="360" y="230" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">mod p every few terms.</text>
