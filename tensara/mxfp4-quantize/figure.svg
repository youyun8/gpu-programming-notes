<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" width="720" height="266" class="fig-svg" role="img">
<title>MXFP4 quantisation: one power-of-two scale per 32 values, E2M1 elements</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="tensara-mxfp4-quantize-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="tensara-mxfp4-quantize-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="tensara-mxfp4-quantize-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="tensara-mxfp4-quantize-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="tensara-mxfp4-quantize-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="tensara-mxfp4-quantize-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="tensara-mxfp4-quantize-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="266" class="fig-paper"/>
<text x="138" y="54" text-anchor="end" dominant-baseline="central" class="fig-txt t-a fig-small fig-bold">a (one block)</text>
<rect x="150" y="40" width="50" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="175" y="54" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">1.8</text>
<rect x="206" y="40" width="50" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="231" y="54" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−5.4</text>
<rect x="262" y="40" width="50" height="28" rx="2" class="f-a2 s-a" stroke-width="1.2"/>
<text x="287" y="54" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">10.2</text>
<rect x="318" y="40" width="50" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="343" y="54" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.6</text>
<rect x="374" y="40" width="50" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="399" y="54" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−2.4</text>
<rect x="430" y="40" width="50" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="455" y="54" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">7.2</text>
<rect x="486" y="40" width="50" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="511" y="54" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.1</text>
<rect x="542" y="40" width="50" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="567" y="54" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−8.8</text>
<text x="604" y="54" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small">α = 10.2</text>
<rect x="190" y="96" width="380" height="30" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="380" y="111" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">E = ⌊log₂ α⌋ − 2 = 1   →   scale 2<tspan baseline-shift="super" font-size="75%">1</tspan> = 2,  u = 128</text>
<text x="138" y="166" text-anchor="end" dominant-baseline="central" class="fig-txt t-c fig-small fig-bold">a / 2<tspan baseline-shift="super" font-size="75%">E</tspan> → E2M1</text>
<rect x="150" y="152" width="50" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="175" y="166" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">1</text>
<rect x="206" y="152" width="50" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="231" y="166" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−3</text>
<rect x="262" y="152" width="50" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="287" y="166" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">6</text>
<rect x="318" y="152" width="50" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="343" y="166" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.5</text>
<rect x="374" y="152" width="50" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="399" y="166" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−1</text>
<rect x="430" y="152" width="50" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="455" y="166" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">4</text>
<rect x="486" y="152" width="50" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="511" y="166" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0</text>
<rect x="542" y="152" width="50" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="567" y="166" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−4</text>
<line x1="370" y1="128" x2="370" y2="150" class="s-d" stroke-width="1.2" marker-end="url(#tensara-mxfp4-quantize-ah-d)"/>
<text x="40" y="210" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">8 of the 32 elements of a block are shown. E2M1's largest value is 6 = 1.5·2², so e<tspan baseline-shift="sub" font-size="75%">max</tspan> = 2;</text>
<text x="40" y="227" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">FLOOR rounding of the scale exponent then maps the block into ±6 and each element is rounded</text>
<text x="40" y="244" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">to the nearest of ±{0, 0.5, 1, 1.5, 2, 3, 4, 6}. Two codes per byte; the scale byte u = E + 127.</text>
</svg>
