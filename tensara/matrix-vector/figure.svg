<text x="40" y="230" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Lane ℓ multiplies the float4 groups q ≡ ℓ (mod 32) of row i with the same groups of b,</text>
<text x="40" y="247" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">then the warp sums the 32 partials with shuffles. Each byte of A is read once: the</text>
<text x="40" y="264" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">kernel is bandwidth-bound, and b stays in L1/L2 for all rows.</text>
