<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 311" width="720" height="311" class="fig-svg" role="img">
<title>Triplet margin loss: pull the positive closer than the negative by at least m</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="tensara-triplet-margin-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="tensara-triplet-margin-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="tensara-triplet-margin-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="tensara-triplet-margin-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="tensara-triplet-margin-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="tensara-triplet-margin-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="tensara-triplet-margin-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="311" class="fig-paper"/>
<circle cx="200" cy="150" r="126.3" class="fig-none s-hl" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="200" y1="150" x2="265" y2="110" class="s-c" stroke-width="1.6"/>
<line x1="200" y1="150" x2="180" y2="255" class="s-b" stroke-width="1.6"/>
<circle cx="200" cy="150" r="6" class="k-a" stroke-width="1"/>
<rect x="210" y="128.9" width="59.92" height="18.2" rx="3" class="fig-plate"/>
<text x="210" y="138" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small fig-bold">anchor</text>
<circle cx="265" cy="110" r="6" class="k-c" stroke-width="1"/>
<rect x="275" y="88.9" width="76.56" height="18.2" rx="3" class="fig-plate"/>
<text x="275" y="98" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small fig-bold">positive</text>
<circle cx="180" cy="255" r="6" class="k-b" stroke-width="1"/>
<rect x="190" y="233.9" width="76.56" height="18.2" rx="3" class="fig-plate"/>
<text x="190" y="243" text-anchor="start" dominant-baseline="central" class="fig-txt t-b fig-small fig-bold">negative</text>
<text x="420" y="50" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">d(a, p) = 1.526 (green)</text>
<text x="420" y="67" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">d(a, n) = 2.138 (orange)</text>
<text x="420" y="84" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">margin m = 1</text>
<text x="420" y="101" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">ℓ = max(0, d<tspan baseline-shift="sub" font-size="75%">p</tspan> − d<tspan baseline-shift="sub" font-size="75%">n</tspan> + m) = 0.389</text>
<text x="420" y="135" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Red ring: radius d<tspan baseline-shift="sub" font-size="75%">p</tspan> + m. A negative</text>
<text x="420" y="152" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">inside it still costs loss.</text>
<text x="420" y="186" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">One block per triplet reduces the two</text>
<text x="420" y="203" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">squared distances (with +ε per term),</text>
<text x="420" y="220" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">then the B losses are averaged.</text>
</svg>
