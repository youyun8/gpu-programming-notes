<text x="354" y="240" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">  C = max(Z + b, 0)</text>
<text x="354" y="258" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Z is never written</text>
<text x="354" y="276" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">one pass over C</text>
<text x="40" y="340" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">W's nn.Linear layout makes the B operand transposed ("NT"); the tile loader handles it.</text>
