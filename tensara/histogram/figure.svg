<text x="40" y="291" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Each block counts into n<tspan baseline-shift="sub" font-size="75%">b</tspan> shared-memory counters with atomics, then adds them to</text>
<text x="40" y="308" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">global memory once; the counts are returned as floats and compared exactly.</text>
