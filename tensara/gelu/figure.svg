<text x="400" y="36" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">GELU(x) = x Φ(x) ≈ ½ x (1 + tanh(u))</text>
<text x="400" y="58" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">u = √(2/π) (x + 0.044715 x³)</text>
<text x="400" y="96" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">dashed: the exact x·Φ(x); the curves</text>
<text x="400" y="113" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">differ by &lt; 0.001 on this range.</text>
<text x="400" y="147" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">C = f(A) on an M × N matrix: float4</text>
<text x="400" y="164" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">loads and stores, 4 elements per thread.</text>
</svg>
