<text x="40" y="210" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">8 of the 16 values are shown. The element encode divides by the <tspan font-style="italic">rounded</tspan> scale e4m3(s),</text>
<text x="40" y="227" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">so decode(encode(x)) = code · e4m3(s) / g is consistent. Scales are written in the</text>
<text x="40" y="244" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">swizzled 128 × 4 layout: rows r, r + 32, r + 64, r + 96 share one 16-byte group.</text>
