<text x="400" y="111" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">s = e4m3(g · α / 6) = e4m3(1.7) = 1.75   (g = 2)</text>
<text x="158" y="166" text-anchor="end" dominant-baseline="central" class="fig-txt t-c fig-small fig-bold">code = e2m1(a·g/s)</text>
