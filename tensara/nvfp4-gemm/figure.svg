<text x="355" y="227" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">c<tspan baseline-shift="sub" font-size="75%">ij</tspan> = Σ<tspan baseline-shift="sub" font-size="75%">β</tspan> σ<tspan baseline-shift="super" font-size="75%">A</tspan><tspan baseline-shift="sub" font-size="75%">iβ</tspan> σ<tspan baseline-shift="super" font-size="75%">B</tspan><tspan baseline-shift="sub" font-size="75%">jβ</tspan> · (Σ<tspan baseline-shift="sub" font-size="75%">ℓ∈β</tspan> x<tspan baseline-shift="super" font-size="75%">A</tspan><tspan baseline-shift="sub" font-size="75%">iℓ</tspan> x<tspan baseline-shift="super" font-size="75%">B</tspan><tspan baseline-shift="sub" font-size="75%">jℓ</tspan>)</text>
<line x1="293" y1="178" x2="310" y2="208" class="s-c" stroke-width="1.1" marker-end="url(#tensara-nvfp4-gemm-ah-c)"/>
<text x="40" y="274" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">K is cut into blocks of 16; every block has one E4M3 scale per row (σ). The inner</text>
<text x="40" y="291" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">sum over a block runs on low-precision tensor-core MMAs (block-scaled MMA instructions</text>
<text x="40" y="308" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">apply both scales); the global factors enter once at the end: c = acc / (g<tspan baseline-shift="sub" font-size="75%">A</tspan> · g<tspan baseline-shift="sub" font-size="75%">B</tspan>),</text>
<text x="40" y="325" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">then the FP16 output is written. Smaller blocks (16) track local magnitudes better than MX.</text>
