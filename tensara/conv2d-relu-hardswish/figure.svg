<text x="400" y="36" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">O = R · ReLU6(R + 3) / 6</text>
<text x="400" y="58" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">R = max(0, C),  C = conv2d(I, κ)</text>
<text x="400" y="96" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">After ReLU, R ≥ 0, so HardSwish is</text>
<text x="400" y="113" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">R(R + 3)/6 for R &lt; 3 and R for R ≥ 3.</text>
<text x="400" y="147" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The "same" convolution is tiled with</text>
<text x="400" y="164" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">a shared-memory halo; both</text>
<text x="400" y="181" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">activations run in registers before</text>
<text x="400" y="198" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">the single store (fused).</text>
</svg>
