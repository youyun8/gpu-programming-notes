<text x="20" y="196" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">x = a·b &lt; 2⁶²; since 2³¹ ≡ 1 (mod p): x₁ = (x &amp; p) + (x ≫ 31),</text>
<text x="20" y="213" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">x₂ = (x₁ &amp; p) + (x₁ ≫ 31), then subtract p once if x₂ ≥ p.</text>
<text x="20" y="230" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Example: (p − 1) · 2 = 2p − 2 ≡ p − 2 = 2147483645.</text>
