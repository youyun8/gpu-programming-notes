<text x="40" y="140" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">#GEMMs = ⌊log₂P⌋ + popcount(P) − 1: P = 2, 4, 8 need 1, 2, 3 GEMMs. P = 0 returns I.</text>
