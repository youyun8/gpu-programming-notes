<rect x="130" y="90" width="46" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="153" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">1</text>
<rect x="182" y="90" width="46" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="205" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−3</text>
<rect x="234" y="90" width="46" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="257" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">6</text>
<rect x="286" y="90" width="46" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="309" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.5</text>
<rect x="338" y="90" width="46" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="361" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−1</text>
<rect x="390" y="90" width="46" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="413" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">4</text>
<rect x="442" y="90" width="46" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="465" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0</text>
<rect x="494" y="90" width="46" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="517" y="104" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−4</text>
<text x="554" y="134" text-anchor="start" dominant-baseline="central" class="fig-txt t-d fig-small">× 2<tspan baseline-shift="super" font-size="75%">128 − 127</tspan> = 2</text>
<text x="118" y="164" text-anchor="end" dominant-baseline="central" class="fig-txt t-a fig-small fig-bold">out (FP32)</text>
<rect x="130" y="150" width="46" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="153" y="164" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">2</text>
<rect x="182" y="150" width="46" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="205" y="164" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−6</text>
<rect x="234" y="150" width="46" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="257" y="164" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">12</text>
<rect x="286" y="150" width="46" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="309" y="164" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">1</text>
<rect x="338" y="150" width="46" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="361" y="164" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−2</text>
<rect x="390" y="150" width="46" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="413" y="164" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">8</text>
<rect x="442" y="150" width="46" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="465" y="164" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0</text>
<rect x="494" y="150" width="46" height="28" rx="2" class="f-a s-a" stroke-width="1.2"/>
<text x="517" y="164" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−8</text>
<text x="40" y="208" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Element j = 2i sits in the low nibble of byte i, j = 2i + 1 in the high nibble. A tiny lookup of</text>
<text x="40" y="225" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">the 16 codes and an exponent add replace any float arithmetic; one thread writes 8 floats</text>
<text x="40" y="242" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">(two float4 stores) per 4-byte load.</text>
</svg>
