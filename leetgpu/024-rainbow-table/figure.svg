<text x="358" y="167" text-anchor="middle" dominant-baseline="central" class="fig-mono t-ink fig-tiny">h *= P</text>
<line x1="286" y1="157" x2="296" y2="157" class="s-muted" stroke-width="1" marker-end="url(#leetgpu-024-rainbow-table-ah-muted)"/>
<rect x="432" y="140" width="120" height="40" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="492" y="153" text-anchor="middle" dominant-baseline="central" class="fig-mono t-ink fig-tiny">h ^= byte 2</text>
<text x="492" y="167" text-anchor="middle" dominant-baseline="central" class="fig-mono t-ink fig-tiny">h *= P</text>
<line x1="420" y1="157" x2="430" y2="157" class="s-muted" stroke-width="1" marker-end="url(#leetgpu-024-rainbow-table-ah-muted)"/>
<rect x="566" y="140" width="120" height="40" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="626" y="153" text-anchor="middle" dominant-baseline="central" class="fig-mono t-ink fig-tiny">h ^= byte 3</text>
<text x="626" y="167" text-anchor="middle" dominant-baseline="central" class="fig-mono t-ink fig-tiny">h *= P</text>
<line x1="554" y1="157" x2="564" y2="157" class="s-muted" stroke-width="1" marker-end="url(#leetgpu-024-rainbow-table-ah-muted)"/>
<text x="30" y="208" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">P = 16777619 (0x01000193), all arithmetic mod 2³². 8 bytes of memory traffic</text>
<text x="30" y="225" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">buy up to 800 integer operations per thread: compute-bound, not memory-bound.</text>
