<text x="357.5" y="99" text-anchor="middle" dominant-baseline="central" class="fig-txt t-d fig-small">R rounds (R ≤ 100)</text>
<text x="30" y="126" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">one round H(x): consume the 4 bytes of x, least significant first</text>
<rect x="30" y="140" width="120" height="40" rx="4" class="fig-paper s-ink" stroke-width="1.2"/>
<text x="90" y="160" text-anchor="middle" dominant-baseline="central" class="fig-mono t-ink fig-tiny">h = 0x811C9DC5</text>
