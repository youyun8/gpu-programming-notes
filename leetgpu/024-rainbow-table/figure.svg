<text x="224" y="153" text-anchor="middle" dominant-baseline="central" class="fig-mono t-ink fig-tiny">h ^= byte 0</text>
<text x="224" y="167" text-anchor="middle" dominant-baseline="central" class="fig-mono t-ink fig-tiny">h *= P</text>
<line x1="152" y1="157" x2="162" y2="157" class="s-muted" stroke-width="1" marker-end="url(#leetgpu-024-rainbow-table-ah-muted)"/>
<rect x="298" y="140" width="120" height="40" rx="4" class="f-b s-b" stroke-width="1.2"/>
