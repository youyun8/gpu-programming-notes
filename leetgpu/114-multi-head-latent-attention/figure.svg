<rect x="288" y="50" width="20" height="26" rx="1" class="f-d2 s-d" stroke-width="0.8"/>
<rect x="310" y="50" width="20" height="26" rx="1" class="f-d2 s-d" stroke-width="0.8"/>
<line x1="40" y1="88" x2="258" y2="88" class="s-b" stroke-width="1"/>
<line x1="40" y1="84" x2="40" y2="92" class="s-b" stroke-width="1"/>
<line x1="258" y1="84" x2="258" y2="92" class="s-b" stroke-width="1"/>
<text x="149" y="99" text-anchor="middle" dominant-baseline="central" class="fig-txt t-b fig-small">latent c<tspan baseline-shift="sub" font-size="75%">t</tspan> (width R)</text>
<line x1="266" y1="88" x2="330" y2="88" class="s-d" stroke-width="1"/>
<line x1="266" y1="84" x2="266" y2="92" class="s-d" stroke-width="1"/>
<line x1="330" y1="84" x2="330" y2="92" class="s-d" stroke-width="1"/>
<text x="298" y="99" text-anchor="middle" dominant-baseline="central" class="fig-txt t-d fig-small">k<tspan baseline-shift="sub" font-size="75%">t</tspan><tspan baseline-shift="super" font-size="75%">pe</tspan> (r)</text>
<rect x="40" y="140" width="150" height="46" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="115" y="163" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">q<tspan baseline-shift="sub" font-size="75%">h</tspan> = [q<tspan baseline-shift="super" font-size="75%">nope</tspan> | q<tspan baseline-shift="super" font-size="75%">pe</tspan>]</text>
<rect x="206" y="140" width="150" height="46" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="281" y="154.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">q̃<tspan baseline-shift="sub" font-size="75%">h</tspan> = q<tspan baseline-shift="super" font-size="75%">nope</tspan> W<tspan baseline-shift="sub" font-size="75%">UK,h</tspan></text>
<text x="281" y="171.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">(absorbed)</text>
<line x1="192" y1="163" x2="204" y2="163" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-114-multi-head-latent-attention-ah-muted)"/>
<rect x="372" y="140" width="150" height="46" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="447" y="154.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">s = q̃·c<tspan baseline-shift="sub" font-size="75%">t</tspan> + q<tspan baseline-shift="super" font-size="75%">pe</tspan>·k<tspan baseline-shift="super" font-size="75%">pe</tspan><tspan baseline-shift="sub" font-size="75%">t</tspan></text>
<text x="447" y="171.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">× scale</text>
<line x1="358" y1="163" x2="370" y2="163" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-114-multi-head-latent-attention-ah-muted)"/>
<rect x="538" y="140" width="150" height="46" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="613" y="154.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">softmax, then</text>
<text x="613" y="171.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">o = Σ p c<tspan baseline-shift="sub" font-size="75%">t</tspan> · W<tspan baseline-shift="sub" font-size="75%">UV,h</tspan></text>
<line x1="524" y1="163" x2="536" y2="163" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-114-multi-head-latent-attention-ah-muted)"/>
<text x="40" y="216" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Per-head keys and values are never materialised: W<tspan baseline-shift="sub" font-size="75%">UK</tspan> is folded into the query and W<tspan baseline-shift="sub" font-size="75%">UV</tspan> is</text>
<text x="40" y="233" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">applied after the weighted sum. The cache holds R + r numbers per token instead of</text>
<text x="40" y="250" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">2 · heads · d<tspan baseline-shift="sub" font-size="75%">head</tspan>, a &gt;10× reduction. One block per head scans the whole cache.</text>
</svg>
