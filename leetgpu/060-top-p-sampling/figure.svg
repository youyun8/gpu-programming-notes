<line x1="66" y1="190" x2="492" y2="190" class="s-ink" stroke-width="1"/>
<text x="522" y="50" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">tokens by probability (desc.)</text>
<text x="522" y="67" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">p = 0.7: keep t0 … t3</text>
<text x="522" y="84" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">cumulative mass = 0.77 ≥ p</text>
<text x="522" y="101" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">threshold T = 0.10</text>
<text x="522" y="135" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">renormalise the kept mass</text>
<text x="522" y="152" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">and sample with the seed</text>
<text x="40" y="234" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">No full sort: the nucleus is {t : π<tspan baseline-shift="sub" font-size="75%">t</tspan> ≥ T}, so T is found by a radix-select style</text>
<text x="40" y="251" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">search on the probability bits, with block-wide sums of the mass above each candidate.</text>
