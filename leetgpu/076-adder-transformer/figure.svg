<text x="374" y="214" text-anchor="middle" dominant-baseline="central" class="fig-txt t-hl fig-small">11 decode steps; K and V of the new token are appended to the cache</text>
<text x="40" y="246" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Only the last position is computed per step (O(p) instead of O(p²)); the output is</text>
<text x="40" y="263" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">the logits of every step, [batch, 11, 10]. The model has 10 parameters.</text>
