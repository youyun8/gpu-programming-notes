<text x="40" y="322" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Top row, once per sample: the condition c yields six vectors that modulate the</text>
<text x="40" y="339" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">two LayerNorms (γ, β) and gate the two residual branches (g), so every sample in</text>
<text x="40" y="356" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">the batch is normalised differently. The gates start at zero ("Zero"), which makes</text>
<text x="40" y="373" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">a freshly initialised block the identity.</text>
