<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 339" width="720" height="339" class="fig-svg" role="img">
<title>Attention backward without storing P: recompute it tile by tile from Q, K and the LSE</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="leetgpu-111-softmax-attention-backward-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="leetgpu-111-softmax-attention-backward-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="leetgpu-111-softmax-attention-backward-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="leetgpu-111-softmax-attention-backward-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="leetgpu-111-softmax-attention-backward-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="leetgpu-111-softmax-attention-backward-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="leetgpu-111-softmax-attention-backward-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="339" class="fig-paper"/>
<rect x="30" y="50" width="110" height="34" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="85" y="67" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">Q, K, LSE</text>
<rect x="180" y="50" width="200" height="34" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="280" y="67" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">P = exp(QKᵀ/√d − LSE)</text>
<rect x="430" y="30" width="200" height="34" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="530" y="47" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">dV += Pᵀ dO</text>
<rect x="180" y="130" width="200" height="34" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="280" y="147" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">dP = dO Vᵀ</text>
<rect x="430" y="110" width="200" height="34" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="530" y="127" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">dS = P ⊙ (dP − D)</text>
<rect x="430" y="180" width="200" height="34" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="530" y="197" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">dQ += dS K / √d</text>
<rect x="430" y="240" width="200" height="34" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="530" y="257" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">dK += dSᵀ Q / √d</text>
<rect x="180" y="210" width="200" height="34" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="280" y="227" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">D = rowsum(dO ⊙ O)</text>
<line x1="142" y1="67" x2="178" y2="67" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-111-softmax-attention-backward-ah-muted)"/>
<line x1="382" y1="62" x2="428" y2="47" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-111-softmax-attention-backward-ah-muted)"/>
<line x1="382" y1="74" x2="428" y2="122" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-111-softmax-attention-backward-ah-muted)"/>
<line x1="382" y1="147" x2="428" y2="132" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-111-softmax-attention-backward-ah-muted)"/>
<line x1="382" y1="222" x2="428" y2="140" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-111-softmax-attention-backward-ah-muted)"/>
<line x1="530" y1="146" x2="530" y2="178" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-111-softmax-attention-backward-ah-muted)"/>
<path d="M632,127 L670,127 L670,257 L632,257" class="fig-none s-muted" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#leetgpu-111-softmax-attention-backward-ah-muted)"/>
<text x="40" y="300" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">D<tspan baseline-shift="sub" font-size="75%">i</tspan> = dO<tspan baseline-shift="sub" font-size="75%">i</tspan> · O<tspan baseline-shift="sub" font-size="75%">i</tspan> is precomputed per row. The forward pass saves only the row log-sum-exp,</text>
<text x="40" y="317" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">so the backward kernel rebuilds each P tile on the fly and never writes an M × N matrix.</text>
</svg>
