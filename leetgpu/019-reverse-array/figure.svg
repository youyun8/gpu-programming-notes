<text x="40" y="218" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Only ⌊N/2⌋ threads run and each owns one pair, so no two threads touch the</text>
<text x="40" y="235" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">same element: no race and no second buffer. The middle element (odd N) stays.</text>
