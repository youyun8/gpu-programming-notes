<text x="508" y="94" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−1</text>
<line x1="556" y1="94" x2="556" y2="130" class="s-muted" stroke-width="1" marker-end="url(#leetgpu-005-softmax-ah-muted)"/>
<text x="146" y="144" text-anchor="end" dominant-baseline="central" class="fig-txt t-d fig-small fig-bold">e<tspan baseline-shift="super" font-size="75%">x − m</tspan></text>
<rect x="160" y="130" width="56" height="28" rx="2" class="f-d s-d" stroke-width="1.2"/>
<text x="188" y="144" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.018</text>
<rect x="224" y="130" width="56" height="28" rx="2" class="f-d s-d" stroke-width="1.2"/>
<text x="252" y="144" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.135</text>
<rect x="288" y="130" width="56" height="28" rx="2" class="f-d s-d" stroke-width="1.2"/>
<text x="316" y="144" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.05</text>
<rect x="352" y="130" width="56" height="28" rx="2" class="f-d s-d" stroke-width="1.2"/>
<text x="380" y="144" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">1</text>
