<text x="380" y="94" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0</text>
<rect x="416" y="80" width="56" height="28" rx="2" class="f-b s-b" stroke-width="1.2"/>
<text x="444" y="94" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">−5</text>
