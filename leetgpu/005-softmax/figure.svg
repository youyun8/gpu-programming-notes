<rect x="480" y="130" width="56" height="28" rx="2" class="f-d s-d" stroke-width="1.2"/>
<text x="508" y="144" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.368</text>
<line x1="556" y1="144" x2="556" y2="180" class="s-muted" stroke-width="1" marker-end="url(#leetgpu-005-softmax-ah-muted)"/>
<text x="146" y="194" text-anchor="end" dominant-baseline="central" class="fig-txt t-c fig-small fig-bold">p = e / s</text>
<rect x="160" y="180" width="56" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="188" y="194" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.012</text>
<rect x="224" y="180" width="56" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="252" y="194" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.086</text>
<rect x="288" y="180" width="56" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="316" y="194" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.032</text>
<rect x="352" y="180" width="56" height="28" rx="2" class="f-c2 s-c" stroke-width="1.2"/>
<text x="380" y="194" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.634</text>
<rect x="416" y="180" width="56" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="444" y="194" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.004</text>
<rect x="480" y="180" width="56" height="28" rx="2" class="f-c s-c" stroke-width="1.2"/>
<text x="508" y="194" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">0.233</text>
<text x="564" y="62" text-anchor="start" dominant-baseline="central" class="fig-txt t-b fig-small">m = max = 5</text>
<text x="564" y="162" text-anchor="start" dominant-baseline="central" class="fig-txt t-d fig-small">s = Σ = 1.578</text>
<text x="40" y="246" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The max and the sum are found in one pass by merging (m, s) pairs:</text>
<text x="40" y="263" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">(m₁, s₁) ⊕ (m₂, s₂) = (m, s₁·e<tspan baseline-shift="super" font-size="75%">m₁−m</tspan> + s₂·e<tspan baseline-shift="super" font-size="75%">m₂−m</tspan>),  m = max(m₁, m₂).</text>
</svg>
