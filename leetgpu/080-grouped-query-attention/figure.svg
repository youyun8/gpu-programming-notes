<text x="40" y="230" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">H<tspan baseline-shift="sub" font-size="75%">q</tspan> = 8, H<tspan baseline-shift="sub" font-size="75%">kv</tspan> = 2, group size G = 4: head h reads K/V head ⌊h / G⌋.</text>
<text x="40" y="247" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The KV cache shrinks G×. A kernel can process a whole group per block so each</text>
<text x="40" y="264" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">K/V tile loaded from memory serves G query heads.</text>
