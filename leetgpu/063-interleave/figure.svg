<text x="40" y="208" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Thread i loads a[i] and b[i] and stores them as one float2 (8 bytes) at o[2i]:</text>
<text x="40" y="225" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">both reads and the write are contiguous across the warp, so it streams at full</text>
<text x="40" y="242" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">bandwidth (this is how complex numbers or (x, y) points are packed).</text>
