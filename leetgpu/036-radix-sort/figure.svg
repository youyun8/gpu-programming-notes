<text x="40" y="256" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The example sorts by the high hex digit. A key goes to offset[d] + (its rank among</text>
<text x="40" y="273" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">equal digits); equal digits keep their order (2B before 21 before 2C): stable.</text>
<text x="40" y="290" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The real kernel uses 8-bit digits, tiles of 2048 keys and 4 passes.</text>
