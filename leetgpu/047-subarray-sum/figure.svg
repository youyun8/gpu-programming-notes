<text x="366" y="103" text-anchor="middle" dominant-baseline="central" class="fig-txt t-hl fig-small">S = 2 … E = 7:  sum = 27</text>
<text x="40" y="140" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Only the E − S + 1 elements in range are read. Threads map a flat index i to</text>
<text x="40" y="157" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">x[S + i]; per-thread int sums, a warp __reduce_add_sync, then one atomicAdd.</text>
<text x="40" y="174" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The maximum 10 · 10⁸ = 10⁹ &lt; 2³¹, so int32 cannot overflow.</text>
