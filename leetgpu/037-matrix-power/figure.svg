<text x="440" y="78" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-bold">A⁸</text>
<text x="440" y="44" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">bit 3 = 0</text>
<line x1="362" y1="78" x2="398" y2="78" class="s-a" stroke-width="1.2" marker-end="url(#leetgpu-037-matrix-power-ah-a)"/>
<text x="380" y="92" text-anchor="middle" dominant-baseline="central" class="fig-txt t-a fig-small">²</text>
<rect x="520" y="60" width="80" height="36" rx="4" class="f-c2 s-c" stroke-width="1.2"/>
<text x="560" y="78" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-bold">A¹⁶</text>
<text x="560" y="44" text-anchor="middle" dominant-baseline="central" class="fig-txt t-c fig-small">bit 4 = 1</text>
<line x1="482" y1="78" x2="518" y2="78" class="s-a" stroke-width="1.2" marker-end="url(#leetgpu-037-matrix-power-ah-a)"/>
<text x="500" y="92" text-anchor="middle" dominant-baseline="central" class="fig-txt t-a fig-small">²</text>
<rect x="280" y="150" width="200" height="36" rx="4" class="f-c2 s-c" stroke-width="1.2"/>
<text x="380" y="168" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-bold">A²⁰ = A⁴ · A¹⁶</text>
<line x1="320" y1="98" x2="340" y2="148" class="s-c" stroke-width="1.2" marker-end="url(#leetgpu-037-matrix-power-ah-c)"/>
<line x1="560" y1="98" x2="440" y2="148" class="s-c" stroke-width="1.2" marker-end="url(#leetgpu-037-matrix-power-ah-c)"/>
<text x="40" y="216" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">20 = 10100₂: 4 squarings + popcount(20) − 1 = 1 extra multiply = 5 GEMMs.</text>
<text x="40" y="233" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The multiplication order mirrors torch.linalg.matrix_power exactly, so float32</text>
<text x="40" y="250" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">rounding matches the reference despite the huge dynamic range of A²⁰.</text>
