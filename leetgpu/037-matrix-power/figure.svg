<text x="80" y="78" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-bold">A</text>
<text x="80" y="44" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">bit 0 = 0</text>
<rect x="160" y="60" width="80" height="36" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="200" y="78" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-bold">A²</text>
<text x="200" y="44" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">bit 1 = 0</text>
