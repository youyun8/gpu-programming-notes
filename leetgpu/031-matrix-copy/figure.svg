<text x="40" y="180" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Each thread moves one float4 (16 bytes); a warp moves 512 contiguous bytes per</text>
<text x="40" y="197" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">instruction. There is no arithmetic: the achieved GB/s is the ceiling for every</text>
<text x="40" y="214" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">memory-bound kernel on this GPU.</text>
