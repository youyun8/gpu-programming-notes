<rect x="40" y="50" width="110" height="34" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="95" y="67" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">x (sublayer out)</text>
<rect x="40" y="110" width="110" height="34" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="95" y="127" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">r (residual)</text>
<rect x="210" y="80" width="120" height="34" rx="4" class="f-d2 s-d" stroke-width="1.2"/>
<text x="270" y="97" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">z = x + r</text>
<line x1="152" y1="67" x2="208" y2="90" class="s-a" stroke-width="1.1" marker-end="url(#leetgpu-083-fused-residual-add-rms-norm-ah-a)"/>
<line x1="152" y1="127" x2="208" y2="106" class="s-b" stroke-width="1.1" marker-end="url(#leetgpu-083-fused-residual-add-rms-norm-ah-b)"/>
<rect x="390" y="80" width="140" height="34" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="460" y="97" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-tiny">rms<tspan baseline-shift="sub" font-size="75%">i</tspan> = √(mean z² + ε)</text>
<line x1="332" y1="97" x2="388" y2="97" class="s-d" stroke-width="1.1" marker-end="url(#leetgpu-083-fused-residual-add-rms-norm-ah-d)"/>
<rect x="570" y="80" width="110" height="34" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="625" y="97" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">y = z / rms · w</text>
<line x1="532" y1="97" x2="568" y2="97" class="s-c" stroke-width="1.1" marker-end="url(#leetgpu-083-fused-residual-add-rms-norm-ah-c)"/>
<rect x="200" y="60" width="340" height="74" rx="0" class="fig-none s-hl" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="370" y="150" text-anchor="middle" dominant-baseline="central" class="fig-txt t-hl fig-small">registers / shared memory only</text>
<text x="40" y="190" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">One block per row: read x and r once, add, reduce Σz², normalise and write y.</text>
<text x="40" y="207" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Unfused, z would be written and read back: 2 extra full-size memory passes.</text>
