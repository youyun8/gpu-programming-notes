<text x="360" y="144" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">y<tspan baseline-shift="sub" font-size="75%">i</tspan> = γ · x<tspan baseline-shift="sub" font-size="75%">i</tspan> / rms + β  (γ = 1, β = 0)</text>
