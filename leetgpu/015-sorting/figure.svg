<text x="150" y="146" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">0x3F800000</text>
<text x="290" y="146" text-anchor="start" dominant-baseline="central" class="fig-mono t-c fig-small">0xBF800000</text>
<text x="430" y="146" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">2</text>
<text x="510" y="68" text-anchor="start" dominant-baseline="central" class="fig-txt t-b fig-small">negative: flip all bits</text>
<text x="510" y="92" text-anchor="start" dominant-baseline="central" class="fig-txt t-b fig-small">non-negative: set the sign bit</text>
