<line x1="348" y1="206" x2="370" y2="206" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-015-sorting-ah-muted)"/>
<rect x="538" y="190" width="140" height="32" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="608" y="206" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">digit 3 (top)</text>
<line x1="514" y1="206" x2="536" y2="206" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-015-sorting-ah-muted)"/>
<text x="40" y="176" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">4 stable counting-sort passes: histogram per tile → scan → scatter</text>
<text x="40" y="248" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Unsigned key order equals float order, so four 8-bit passes sort the data;</text>
<text x="40" y="265" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">stability keeps the order set by the lower digits.</text>
