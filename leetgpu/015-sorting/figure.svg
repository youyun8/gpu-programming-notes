<line x1="182" y1="206" x2="204" y2="206" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-015-sorting-ah-muted)"/>
<rect x="372" y="190" width="140" height="32" rx="4" class="f-d s-d" stroke-width="1.2"/>
