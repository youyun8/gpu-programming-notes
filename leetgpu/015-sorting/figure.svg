<text x="430" y="94" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">3</text>
<text x="40" y="120" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small">−0.5</text>
<text x="150" y="120" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">0xBF000000</text>
<text x="290" y="120" text-anchor="start" dominant-baseline="central" class="fig-mono t-c fig-small">0x40FFFFFF</text>
<text x="430" y="120" text-anchor="start" dominant-baseline="central" class="fig-txt t-c fig-small">1</text>
