<text x="40" y="68" text-anchor="start" dominant-baseline="central" class="fig-txt t-a fig-small">−2.5</text>
<text x="150" y="68" text-anchor="start" dominant-baseline="central" class="fig-mono t-ink fig-small">0xC0200000</text>
