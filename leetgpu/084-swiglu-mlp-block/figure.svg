<rect x="0" y="0" width="720" height="257" class="fig-paper"/>
<rect x="24" y="46" width="108" height="38" rx="4" class="f-a s-a" stroke-width="1.2"/>
<text x="78" y="65" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">X (M × d)</text>
<rect x="154" y="46" width="108" height="38" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="208" y="56.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">gate GEMM</text>
<text x="208" y="73.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">G = X W<tspan baseline-shift="sub" font-size="75%">g</tspan></text>
<line x1="134" y1="65" x2="152" y2="65" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-084-swiglu-mlp-block-ah-muted)"/>
<rect x="284" y="46" width="108" height="38" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="338" y="56.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">up GEMM</text>
<text x="338" y="73.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">U = X W<tspan baseline-shift="sub" font-size="75%">u</tspan></text>
<line x1="264" y1="65" x2="282" y2="65" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-084-swiglu-mlp-block-ah-muted)"/>
<rect x="414" y="46" width="108" height="38" rx="4" class="f-d s-d" stroke-width="1.2"/>
<text x="468" y="56.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">H = SiLU(G) ⊙ U</text>
<text x="468" y="73.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">(fused)</text>
<line x1="394" y1="65" x2="412" y2="65" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-084-swiglu-mlp-block-ah-muted)"/>
<rect x="544" y="46" width="108" height="38" rx="4" class="f-b s-b" stroke-width="1.2"/>
<text x="598" y="56.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">down GEMM</text>
<text x="598" y="73.5" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">Y = H W<tspan baseline-shift="sub" font-size="75%">d</tspan></text>
<line x1="524" y1="65" x2="542" y2="65" class="s-muted" stroke-width="1.1" marker-end="url(#leetgpu-084-swiglu-mlp-block-ah-muted)"/>
<path d="M598.0,86.0 L598.0,96.0 L78.0,96.0 L78.0,148.0" class="fig-none s-muted" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#leetgpu-084-swiglu-mlp-block-ah-muted)"/>
<rect x="24" y="150" width="108" height="38" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="78" y="169" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">Y (M × d)</text>
<text x="40" y="218" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The gate and up GEMMs share X, so they run as one GEMM against [W<tspan baseline-shift="sub" font-size="75%">g</tspan> | W<tspan baseline-shift="sub" font-size="75%">u</tspan>]; SiLU(G)⊙U is</text>
<text x="40" y="235" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">applied in its epilogue, so G and U never reach memory. LLaMA-3 8B: d = 4096, d<tspan baseline-shift="sub" font-size="75%">f</tspan> = 14336.</text>
</svg>
