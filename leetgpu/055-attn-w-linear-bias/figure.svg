<text x="130" y="47" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-tiny">0</text>
<text x="102" y="76" text-anchor="end" dominant-baseline="central" class="fig-txt t-muted fig-tiny">0</text>
<text x="170" y="47" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-tiny">1</text>
<text x="102" y="116" text-anchor="end" dominant-baseline="central" class="fig-txt t-muted fig-tiny">1</text>
<text x="210" y="47" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-tiny">2</text>
