<text x="102" y="316" text-anchor="end" dominant-baseline="central" class="fig-txt t-muted fig-tiny">6</text>
<text x="430" y="66" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">S<tspan baseline-shift="sub" font-size="75%">ij</tspan> = q<tspan baseline-shift="sub" font-size="75%">i</tspan> · k<tspan baseline-shift="sub" font-size="75%">j</tspan> / √d + α (i − j)</text>
<text x="430" y="100" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">cells: the bias α (i − j)</text>
<text x="430" y="117" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">α &lt; 0 penalises distant past keys</text>
<text x="430" y="134" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">linearly (bias grows with i − j);</text>
<text x="430" y="151" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">keys after i get a positive bias,</text>
<text x="430" y="168" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">since this problem has no mask.</text>
<text x="430" y="202" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">The bias is computed on the fly</text>
<text x="430" y="219" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">inside the flash-attention loop:</text>
<text x="430" y="236" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">no position embeddings, no extra</text>
<text x="430" y="253" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">memory traffic.</text>
</svg>
