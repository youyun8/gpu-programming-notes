<text x="40" y="242" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Row 1 of the input (dark blue) becomes row 1 of the output (dark green).</text>
<text x="40" y="259" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">The extra padding column (grey) shifts each row by one bank, so reading a</text>
<text x="40" y="276" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">column of the shared tile hits 32 different banks: no bank conflicts.</text>
