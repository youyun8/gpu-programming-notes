<text x="170" y="36" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">distance matrix in B × B blocks (k-block = 2)</text>
<rect x="320" y="56" width="14" height="12" rx="2" class="f-hl s-hl" stroke-width="1"/>
<text x="340" y="62" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">phase 1: pivot block (k, k)</text>
<rect x="320" y="74" width="14" height="12" rx="2" class="f-b2 s-b" stroke-width="1"/>
<text x="340" y="80" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">phase 2: pivot row and column</text>
<rect x="320" y="92" width="14" height="12" rx="2" class="f-a s-a" stroke-width="1"/>
