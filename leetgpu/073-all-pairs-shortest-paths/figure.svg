<text x="320" y="140" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">d<tspan baseline-shift="sub" font-size="75%">ij</tspan> = min(d<tspan baseline-shift="sub" font-size="75%">ij</tspan>, d<tspan baseline-shift="sub" font-size="75%">ik</tspan> + d<tspan baseline-shift="sub" font-size="75%">kj</tspan>)</text>
<text x="320" y="157" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">for every k inside the k-block.</text>
<text x="320" y="191" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Phase 3 is a (min, +) "matrix</text>
<text x="320" y="208" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">product" of the pivot column and</text>
<text x="320" y="225" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">pivot row: tiled like GEMM,</text>
<text x="320" y="242" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">in shared memory.</text>
