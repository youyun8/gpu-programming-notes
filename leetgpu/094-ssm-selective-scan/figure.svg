<text x="40" y="200" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Ā = exp(Δ<tspan baseline-shift="sub" font-size="75%">t</tspan> A), B̄ = Δ<tspan baseline-shift="sub" font-size="75%">t</tspan> B<tspan baseline-shift="sub" font-size="75%">t</tspan> (input-dependent), h<tspan baseline-shift="sub" font-size="75%">t</tspan> = Ā h<tspan baseline-shift="sub" font-size="75%">t−1</tspan> + B̄ u<tspan baseline-shift="sub" font-size="75%">t</tspan>,</text>
<text x="40" y="217" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">y<tspan baseline-shift="sub" font-size="75%">t</tspan> = C<tspan baseline-shift="sub" font-size="75%">t</tspan> · h<tspan baseline-shift="sub" font-size="75%">t</tspan> + s · u<tspan baseline-shift="sub" font-size="75%">t</tspan>.  One thread owns one (b, d, n) state and walks t sequentially</text>
<text x="40" y="234" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">in registers; the N ≤ 64 states of a channel are reduced for y<tspan baseline-shift="sub" font-size="75%">t</tspan> with warp shuffles.</text>
