<text x="450" y="50" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">nn(i) = argmin<tspan baseline-shift="sub" font-size="75%">j ≠ i</tspan> d<tspan baseline-shift="sub" font-size="75%">ij</tspan> (ties →</text>
<text x="450" y="67" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">smallest j), d = Δx² + Δy² + Δz².</text>
<text x="450" y="101" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Exact match with PyTorch: each of</text>
<text x="450" y="118" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Δx², Δy², Δz² is rounded separately</text>
<text x="450" y="135" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">and summed left to right (no FMA</text>
<text x="450" y="152" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">contraction). Blocks tile the O(N²)</text>
<text x="450" y="169" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">loop through shared memory.</text>
