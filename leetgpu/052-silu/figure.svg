<text x="440" y="36" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-bold">SiLU(x) = x · σ(x) = x / (1 + e⁻ˣ)</text>
<text x="440" y="58" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">→ x for large x, → 0⁻ for very negative x</text>
