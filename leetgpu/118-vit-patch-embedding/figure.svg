<text x="40" y="222" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">A convolution with kernel = stride = P is exactly im2col + GEMM: the patch gather is a</text>
<text x="40" y="239" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">pure index transform, fused into the GEMM's A-tile loads; bias and positional embeddings</text>
<text x="40" y="256" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">are added in the epilogue, and row 0 of every image is the learned CLS token.</text>
