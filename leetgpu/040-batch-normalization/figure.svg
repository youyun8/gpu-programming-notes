<text x="414" y="176" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">y<tspan baseline-shift="sub" font-size="75%">ij</tspan> = γ<tspan baseline-shift="sub" font-size="75%">j</tspan> (x<tspan baseline-shift="sub" font-size="75%">ij</tspan> − μ<tspan baseline-shift="sub" font-size="75%">j</tspan>)</text>
<text x="414" y="194" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">  / √(σ<tspan baseline-shift="sub" font-size="75%">j</tspan>² + ε) + β<tspan baseline-shift="sub" font-size="75%">j</tspan></text>
<text x="40" y="240" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Threads of a warp take consecutive columns, so every row read is coalesced while</text>
<text x="40" y="257" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">each thread walks down its own column; partial (n, mean, M2) states merge exactly.</text>
