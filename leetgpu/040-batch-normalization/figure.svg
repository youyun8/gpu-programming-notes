<text x="414" y="92" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">σ<tspan baseline-shift="sub" font-size="75%">j</tspan>² = biased variance</text>
<text x="414" y="110" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Welford + Chan merge</text>
