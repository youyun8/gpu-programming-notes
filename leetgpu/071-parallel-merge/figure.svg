<text x="370" y="60" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">red: the merge path (down = take A,</text>
<text x="370" y="77" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">right = take B); shaded cells: A<tspan baseline-shift="sub" font-size="75%">i</tspan> &gt; B<tspan baseline-shift="sub" font-size="75%">j</tspan>.</text>
<text x="370" y="111" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Dashed diagonals: output positions</text>
<text x="370" y="128" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">k = 4 and k = 8. Where a diagonal</text>
<text x="370" y="145" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">crosses the path gives the co-rank</text>
<text x="370" y="162" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">i (elements from A before k): a</text>
<text x="370" y="179" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">binary search on the diagonal.</text>
<text x="370" y="213" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Every thread then merges its own</text>
<text x="370" y="230" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">k-range sequentially, independently.</text>
