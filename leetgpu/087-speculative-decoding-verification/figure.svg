<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" class="fig-svg" role="img">
<title>Speculative decoding: accept draft tokens left to right, stop at the first rejection</title><style>.fig-paper{fill:var(--fig-paper,#ffffff)}.fig-panel{fill:var(--fig-panel,#f8fafc)}.fig-none{fill:none}.s-ink{stroke:var(--fig-ink,#1f2937)}.t-ink{fill:var(--fig-ink,#1f2937)}.f-ink{fill:var(--fig-ink-soft,#f3f4f6)}.f-ink2{fill:var(--fig-ink-mid,#e5e7eb)}.k-ink{fill:var(--fig-ink,#1f2937)}.s-muted{stroke:var(--fig-muted,#6b7280)}.t-muted{fill:var(--fig-muted,#6b7280)}.f-muted{fill:var(--fig-muted-soft,#f9fafb)}.f-muted2{fill:var(--fig-muted-mid,#e5e7eb)}.k-muted{fill:var(--fig-muted,#6b7280)}.s-line{stroke:var(--fig-line,#9ca3af)}.t-line{fill:var(--fig-line,#9ca3af)}.f-line{fill:var(--fig-line-soft,#f3f4f6)}.f-line2{fill:var(--fig-line-mid,#d1d5db)}.k-line{fill:var(--fig-line,#9ca3af)}.s-a{stroke:var(--fig-a,#2563eb)}.t-a{fill:var(--fig-a,#2563eb)}.f-a{fill:var(--fig-a-soft,#dbeafe)}.f-a2{fill:var(--fig-a-mid,#93c5fd)}.k-a{fill:var(--fig-a,#2563eb)}.s-b{stroke:var(--fig-b,#c2410c)}.t-b{fill:var(--fig-b,#c2410c)}.f-b{fill:var(--fig-b-soft,#ffedd5)}.f-b2{fill:var(--fig-b-mid,#fdba74)}.k-b{fill:var(--fig-b,#c2410c)}.s-c{stroke:var(--fig-c,#15803d)}.t-c{fill:var(--fig-c,#15803d)}.f-c{fill:var(--fig-c-soft,#dcfce7)}.f-c2{fill:var(--fig-c-mid,#86efac)}.k-c{fill:var(--fig-c,#15803d)}.s-d{stroke:var(--fig-d,#7c3aed)}.t-d{fill:var(--fig-d,#7c3aed)}.f-d{fill:var(--fig-d-soft,#ede9fe)}.f-d2{fill:var(--fig-d-mid,#c4b5fd)}.k-d{fill:var(--fig-d,#7c3aed)}.s-hl{stroke:var(--fig-hl,#dc2626)}.t-hl{fill:var(--fig-hl,#dc2626)}.f-hl{fill:var(--fig-hl-soft,#fee2e2)}.f-hl2{fill:var(--fig-hl-mid,#fca5a5)}.k-hl{fill:var(--fig-hl,#dc2626)}.fig-txt{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}.fig-mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace;font-size:15px}.fig-small{font-size:13px}.fig-tiny{font-size:11px}.fig-big{font-size:17px}.fig-plate{fill:var(--fig-paper,#ffffff);fill-opacity:.92}.fig-bold{font-weight:600}.fig-it{font-style:italic}</style>
<defs><marker id="leetgpu-087-speculative-decoding-verification-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-ink"/></marker><marker id="leetgpu-087-speculative-decoding-verification-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-muted"/></marker><marker id="leetgpu-087-speculative-decoding-verification-ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-a"/></marker><marker id="leetgpu-087-speculative-decoding-verification-ah-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-b"/></marker><marker id="leetgpu-087-speculative-decoding-verification-ah-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-c"/></marker><marker id="leetgpu-087-speculative-decoding-verification-ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-d"/></marker><marker id="leetgpu-087-speculative-decoding-verification-ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="k-hl"/></marker></defs>
<rect x="0" y="0" width="720" height="290" class="fig-paper"/>
<rect x="40" y="60" width="120" height="34" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="100" y="77" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">draft t0</text>
<text x="100" y="112" text-anchor="middle" dominant-baseline="central" class="fig-txt t-c fig-small">α = 0.9, u = 0.62</text>
<text x="100" y="130" text-anchor="middle" dominant-baseline="central" class="fig-txt t-c fig-small fig-bold">u &lt; α: accept</text>
<rect x="190" y="60" width="120" height="34" rx="4" class="f-c s-c" stroke-width="1.2"/>
<text x="250" y="77" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">draft t1</text>
<text x="250" y="112" text-anchor="middle" dominant-baseline="central" class="fig-txt t-c fig-small">α = 0.5, u = 0.31</text>
<text x="250" y="130" text-anchor="middle" dominant-baseline="central" class="fig-txt t-c fig-small fig-bold">u &lt; α: accept</text>
<rect x="340" y="60" width="120" height="34" rx="4" class="f-hl s-hl" stroke-width="1.2"/>
<text x="400" y="77" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">draft t2</text>
<text x="400" y="112" text-anchor="middle" dominant-baseline="central" class="fig-txt t-hl fig-small">α = 0.2, u = 0.74</text>
<text x="400" y="130" text-anchor="middle" dominant-baseline="central" class="fig-txt t-hl fig-small fig-bold">u ≥ α: reject</text>
<rect x="490" y="60" width="120" height="34" rx="4" class="fig-panel s-line" stroke-width="1.2"/>
<text x="550" y="77" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">draft t3</text>
<text x="550" y="112" text-anchor="middle" dominant-baseline="central" class="fig-txt t-muted fig-small">never examined</text>
<rect x="340" y="170" width="260" height="34" rx="4" class="f-hl s-hl" stroke-width="1.2"/>
<text x="470" y="187" text-anchor="middle" dominant-baseline="central" class="fig-txt t-ink fig-small">resample from r ∝ max(0, q − p)</text>
<line x1="400" y1="140" x2="440" y2="168" class="s-hl" stroke-width="1.2" marker-end="url(#leetgpu-087-speculative-decoding-verification-ah-hl)"/>
<text x="40" y="187" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small fig-bold">output row: t0, t1, r, 0 (zero-padded)</text>
<text x="40" y="234" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">α<tspan baseline-shift="sub" font-size="75%">i</tspan> = min(1, q<tspan baseline-shift="sub" font-size="75%">i</tspan>(t<tspan baseline-shift="sub" font-size="75%">i</tspan>) / p<tspan baseline-shift="sub" font-size="75%">i</tspan>(t<tspan baseline-shift="sub" font-size="75%">i</tspan>)) with target q and draft p. If all T drafts pass, a bonus</text>
<text x="40" y="251" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">token is drawn from q at position T. This rule makes the output distribution exactly the</text>
<text x="40" y="268" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">target model's. One block per sequence; the scan over positions stops early.</text>
</svg>
