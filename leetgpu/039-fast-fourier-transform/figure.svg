<text x="40" y="316" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Stockham form: every stage reads one buffer and writes the other in natural order, so no bit-reversal</text>
<text x="40" y="333" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">pass is needed. Arbitrary N: Bluestein's algorithm turns the DFT into a power-of-two convolution.</text>
