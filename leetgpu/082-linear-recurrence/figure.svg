<text x="40" y="190" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">Each step is the map f<tspan baseline-shift="sub" font-size="75%">t</tspan>(h) = a<tspan baseline-shift="sub" font-size="75%">t</tspan> h + x<tspan baseline-shift="sub" font-size="75%">t</tspan>, stored as the pair (a<tspan baseline-shift="sub" font-size="75%">t</tspan>, x<tspan baseline-shift="sub" font-size="75%">t</tspan>). Composing two maps:</text>
<text x="40" y="207" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">(A₁, X₁) then (A₂, X₂) = (A₁A₂, A₂X₁ + X₂) — associative, so a parallel scan applies:</text>
<text x="40" y="224" text-anchor="start" dominant-baseline="central" class="fig-txt t-ink fig-small">per-thread chunks, a warp scan of the pairs, then the carry from earlier blocks.</text>
