<text x="20" y="146" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">Bytes 0–3 are pixel 0 (R, G, B, A) and bytes 4–7 pixel 1.</text>
<text x="20" y="163" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">One thread loads a whole pixel as one 32-bit word: v ^ 0x00FFFFFF</text>
<text x="20" y="180" text-anchor="start" dominant-baseline="central" class="fig-txt t-muted fig-small">flips R, G and B in a single instruction and keeps A.</text>
